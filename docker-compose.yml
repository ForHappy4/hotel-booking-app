services:
  mongodb:
    image: mongo:7
    container_name: hotel-booking-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./booking_backend
      dockerfile: Dockerfile
    container_name: hotel-booking-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      MONGODB_URL: mongodb://mongodb:27017/hotel_booking
      MONGODB_DATABASE: hotel_booking
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    container_name: hotel-booking-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongodb_data:
